    <line x1="229.76" y1="320.18" x2="335.46" y2="137.11" stroke="#C6AB70" stroke-width="8.0" stroke-linecap="round" />
    <line x1="242.44" y1="298.22" x2="387.66" y2="308.83" stroke="#C6AB70" stroke-width="8.0" stroke-linecap="round" />
    <line x1="242.44" y1="298.22" x2="160.65" y2="177.76" stroke="#C6AB70" stroke-width="8.0" stroke-linecap="round" />
  </g>

