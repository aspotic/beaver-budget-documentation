    <circle cx="214.4" cy="270.3" r="10.9" fill="#5F4537" />
    <circle cx="218.5" cy="266.3" r="3.8" fill="#F7F5F0" />
    <circle cx="297.6" cy="270.3" r="10.9" fill="#5F4537" />
    <circle cx="301.7" cy="266.3" r="3.8" fill="#F7F5F0" />

